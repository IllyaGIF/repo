<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illya Repository</title>

<style>
body {
    font-family: Helvetica, Arial, sans-serif;
    background: #dbe2ed;
    color: #222;
    margin: 0;
    padding: 20px;
}

.box {
    max-width: 560px;
    margin: 30px auto;
    background: #fff;
    border: 1px solid #aaa;
    border-radius: 8px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

h1 {
    font-size: 24px;
    margin: 0 0 12px;
}

p {
    line-height: 1.4;
}

code {
    display: block;
    word-break: break-all;
    background: #f3f3f3;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 10px;
    margin-top: 8px;
}

.add-cydia {
    display: block;
    text-align: center;
    margin-top: 18px;
    padding: 12px 16px;

    background: #4f75a3;
    color: #fff;

    text-decoration: none;
    font-size: 18px;
    font-weight: bold;

    border: 1px solid #365574;
    border-radius: 7px;

    text-shadow: 0 -1px 0 rgba(0,0,0,0.35);
}

.add-cydia:active {
    background: #385d86;
}

.footer {
    margin-top: 18px;
    font-size: 12px;
    color: #777;
    text-align: center;
}
</style>

</head>

<body>

<div class="box">

<h1>Illya Repository</h1>

<p>
Cydia repository for legacy iOS devices.
</p>

<p>
Add this source in Cydia:
</p>

<code>https://illyagif.github.io/cydia-repo/</code>

<a
    class="add-cydia"
    href="cydia://url/https://cydia.saurik.com/api/share#?source=https://illyagif.github.io/cydia-repo/"
>
    Add to Cydia
</a>

<div class="footer">
Illya Repository
</div>

</div>

</body>
</html>
